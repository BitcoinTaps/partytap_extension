<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BitcoinTaps Status</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 1rem;
    }
    .container {
      padding: 2rem;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 10px;
      max-width: 90%;
      width: 400px;
    }
    .logo {
      width: 200px;
      height: auto;
      margin-bottom: 2rem;
    }
    .pin-block {
      background: #FFB100;
      color: #fff;
      padding: 2rem;
      border-radius: 15px;
      margin: 2rem 0;
      box-shadow: 0 2px 8px rgba(255, 177, 0, 0.3);
    }
    .pin-block h2 {
      font-size: 1.8rem;
      margin: 0 0 1rem 0;
    }
    .pin-number {
      font-size: 3rem;
      font-weight: bold;
      letter-spacing: 0.5rem;
      margin: 0;
    }
    .instruction-block {
      background: #e8f4f8;
      padding: 1.5rem;
      border-radius: 10px;
      margin: 2rem 0;
    }
    .instruction-block h3 {
      color: #FFB100;
      margin: 0 0 1rem 0;
      font-size: 1.2rem;
    }
    .instruction-block p {
      margin: 0;
      line-height: 1.6;
    }
    .offline-info {
      background: #f0f0f0;
      padding: 1.5rem;
      border-radius: 10px;
      margin: 2rem 0;
      border: 2px solid #ddd;
    }
    .offline-info p {
      margin: 0;
      line-height: 1.6;
    }
    .website-link {
      color: #FFB100;
      text-decoration: none;
      font-weight: bold;
    }
    .website-link:hover {
      text-decoration: underline;
    }
    .transaction-info {
      background: #f9f9f9;
      padding: 1.5rem;
      border-radius: 10px;
      margin: 2rem 0;
      border: 1px solid #ddd;
    }
    .transaction-info h3 {
      color: #333;
      margin: 0 0 1rem 0;
      font-size: 1.2rem;
    }
    .transaction-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid #eee;
    }
    .transaction-row:last-child {
      border-bottom: none;
    }
    .transaction-label {
      font-weight: bold;
      color: #666;
    }
    .transaction-value {
      color: #333;
    }
    @media (max-width: 500px) {
      .container {
        width: 95%;
        padding: 1.5rem;
      }
      .logo {
        width: 150px;
      }
      .pin-number {
        font-size: 2.5rem;
        letter-spacing: 0.3rem;
      }
      .instruction-block,
      .offline-info,
      .transaction-info {
        padding: 1rem;
      }
      .transaction-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- BitcoinTaps Logo -->
    <img src="https://bitcointaps.com/wp-content/uploads/2023/09/Logo_bitcoinTaps_106x60.png" alt="BitcoinTaps Logo" class="logo" />

    <!-- PIN Block -->
    <div class="pin-block">
      <h2>PIN</h2>
      <div class="pin-number" id="pinNumber">{{ pin }}</div>
    </div>

    <!-- Instruction Block -->
    <div class="instruction-block">
      <h3>Instruction</h3>
      <p>Click 'ENTER PIN' on the tap and enter the PIN shown above. Enjoy your drink!</p>
    </div>

    <!-- Offline Mode Info -->
    <div class="offline-info">
      <p>You're using BitcoinTaps offline payment mode. For more info visit our website <a href="https://www.BitcoinTaps.com" target="_blank" class="website-link">www.BitcoinTaps.com</a></p>
    </div>

    <!-- Transaction Information 
    <div class="transaction-info">
      <h3>Transactie Informatie</h3>
      <div class="transaction-row">
        <span class="transaction-label">Time:</span>
        <span class="transaction-value" id="currentTime">15:42:31</span>
      </div>
      <div class="transaction-row">
        <span class="transaction-label">Sats:</span>
        <span class="transaction-value">2,500</span>
      </div>
      <div class="transaction-row">
        <span class="transaction-label">Tap Proces:</span>
        <span class="transaction-value">Offline Mode</span>
      </div>
    </div>
   -->
  </div>
</body>
</html>
